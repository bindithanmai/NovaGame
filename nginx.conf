# Nova's Catch Adventure — nginx config
# Serves static game files; proxies /api/* to the Express+SQLite backend.

upstream nova_api {
    server nova-api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;   # catch-all; change to e.g. nova.home for vhost routing

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml;

    # ── Cache headers ────────────────────────────────────────────────────────
    # Game assets are content-addressed by filename — cache aggressively
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|ogg|wav)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # JS + CSS — short cache so updates propagate quickly
    location ~* \.(js|css)$ {
        expires    1h;
        add_header Cache-Control "public";
    }

    # ── API — proxied to Express + SQLite ────────────────────────────────────
    location /api/ {
        proxy_pass         http://nova_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    location = /health {
        proxy_pass http://nova_api;
        access_log off;
    }

    # ── Static game files ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
