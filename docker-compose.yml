version: '3.8'

# Nova's Catch Adventure — nginx + Express/SQLite stack
#
# Quick start (Raspberry Pi or any Linux host):
#   docker compose up -d
#   open http://<host-ip>
#
# Custom port:  PORT_HOST=8080 docker compose up -d
#               (or add PORT_HOST=8080 in a .env file here)
#
# Services:
#   nova-web  — nginx, serves static files, public on PORT_HOST (default 80)
#   nova-api  — Express + SQLite, internal only (not exposed to host)
#
# To run alongside other apps sharing port 80, set server_name in nginx.conf
# and either use a shared nginx/Traefik instance or map PORT_HOST to a
# different port and reverse-proxy to it.

services:

  # ── Static file server ──────────────────────────────────────────────────────
  nova-web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: nova-web:latest
    container_name: nova-web
    restart: unless-stopped
    ports:
      - "${PORT_HOST:-80}:80"
    depends_on:
      nova-api:
        condition: service_healthy
    networks:
      - nova-net
    mem_limit: 64m
    memswap_limit: 64m

    # ── Optional: shared external proxy network (Traefik / nginx-proxy) ──────
    # networks:
    #   - nova-net
    #   - proxy
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.nova.rule=Host(`nova.home`)"
    #   - "traefik.http.services.nova.loadbalancer.server.port=80"

  # ── API + database ──────────────────────────────────────────────────────────
  nova-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nova-api:latest
    container_name: nova-api
    restart: unless-stopped
    # Not exposed to the host — only nova-web can reach it via nova-net
    expose:
      - "3000"
    volumes:
      - nova-scores:/app/data
    environment:
      PORT: "3000"
      DB_PATH: "/app/data/scores.db"
    networks:
      - nova-net
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nova-scores:
    driver: local

networks:
  nova-net:
    driver: bridge

