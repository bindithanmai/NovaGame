version: '3.8'

# Nova's Catch Adventure — local stack
# Run alongside other apps on the same Pi with a shared traefik/nginx proxy,
# or standalone with the port published directly.
#
# Quick start:
#   docker compose up -d
#   open http://<pi-ip>:3000
#
# Change the host port by editing the left side of the ports mapping,
# or set PORT_HOST=8080 in a .env file next to this file.

services:
  nova-game:
    build: .
    image: nova-game:latest
    container_name: nova-game
    restart: unless-stopped

    ports:
      - "${PORT_HOST:-3000}:3000"

    volumes:
      # SQLite database persisted on the host — survives container rebuilds
      - nova-scores:/app/data

    environment:
      PORT: "3000"
      DB_PATH: "/app/data/scores.db"

    # Keeps memory footprint small on the Pi
    mem_limit: 128m
    memswap_limit: 128m

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # ── Optional: attach to a shared reverse-proxy network ──────────────────
    # Uncomment these lines if you run Traefik or nginx-proxy on the Pi so
    # other apps can share port 80/443 with path-based or host-based routing.
    #
    # networks:
    #   - proxy
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.nova.rule=Host(`nova.home`)"
    #   - "traefik.http.services.nova.loadbalancer.server.port=3000"

volumes:
  nova-scores:
    driver: local

